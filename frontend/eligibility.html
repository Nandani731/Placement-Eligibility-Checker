<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Placement Eligibility Checker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        main { max-width: 600px; margin: 20px auto; }
        label { display: block; margin-top: 16px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 20px; padding: 12px 18px; cursor: pointer; }
        #message { margin-top: 16px; }
    </style>
</head>
<body>
    <main>
        <h1>Placement Eligibility Checker</h1>
        <p>Enter your academic details below.</p>

        <form id="eligibilityForm">
            <label for="cgpa">CGPA (0–10)</label>
            <input type="number" id="cgpa" min="0" max="10"
                   step="0.01" required>

            <label for="backlogs">Backlogs</label>
            <input type="number" id="backlogs" min="0"
                   step="1" required>

            <label for="attendance">Attendance (%)</label>
            <input type="number" id="attendance" min="0" max="100"
                   step="0.1" required>

            <button type="submit" id="checkEligibility">
                Check Eligibility
            </button>
        </form>

        <p id="message" role="status"></p>
        <section id="results" aria-live="polite"></section>

        <p><a href="dashboard.html">Back to Dashboard</a></p>
    </main>

    <script src="js/eligibility.js"></script>
</body>
</html>
